name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CONFIGURATION: Release
      PACKAGE_OUTPUT: artifacts/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DeepSeek.slnx

      - name: Test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_REQUIRE_LIVE_TESTS: "true"
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" || "$DEEPSEEK_API_KEY" == "test-key" ]]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY must contain a valid online-test credential."
            exit 1
          fi
          dotnet test DeepSeek.slnx --configuration "$CONFIGURATION" --no-restore

      - name: Resolve package version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"

          if ("${{ github.event_name }}" -eq "push" -and $ref.StartsWith("refs/tags/v")) {
            $version = $refName.Substring(1)
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $projects = @("DeepSeek.Core", "DeepSeek.Agents.AI", "DeepSeek.Decisions")
            $versions = @($projects | ForEach-Object {
              ([xml](Get-Content -Raw "src/$_/$_.csproj")).Project.PropertyGroup.Version
            } | Select-Object -Unique)
            if ($versions.Count -ne 1) {
              throw "Manual verification requires all package projects to have the same version."
            }
            $version = $versions[0]
            Write-Host "Manual verification runs tests and packaging; NuGet publishing requires a v* tag push."
          }
          else {
            throw "NuGet publish requires a version tag push. Current ref: '$ref'."
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve package version from ref '$ref' (ref_name: '$refName')."
          }
          Write-Host "Resolved package version: $version"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack DeepSeek.Core
        run: dotnet pack src/DeepSeek.Core/DeepSeek.Core.csproj --configuration "$CONFIGURATION" --no-restore --output "$PACKAGE_OUTPUT" -p:ContinuousIntegrationBuild=true -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Pack DeepSeek.Agents.AI
        run: dotnet pack src/DeepSeek.Agents.AI/DeepSeek.Agents.AI.csproj --configuration "$CONFIGURATION" --no-restore --output "$PACKAGE_OUTPUT" -p:ContinuousIntegrationBuild=true -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Pack DeepSeek.Decisions
        run: dotnet pack src/DeepSeek.Decisions/DeepSeek.Decisions.csproj --configuration "$CONFIGURATION" --no-restore --output "$PACKAGE_OUTPUT" -p:ContinuousIntegrationBuild=true -p:Version=${{ env.PACKAGE_VERSION }}

      - name: List packages
        shell: pwsh
        run: Get-ChildItem $env:PACKAGE_OUTPUT | Select-Object Name,Length

      - name: Validate package files
        shell: pwsh
        run: |
          $corePackage = Join-Path $env:PACKAGE_OUTPUT "DeepSeek.Core.$env:PACKAGE_VERSION.nupkg"
          $agentsPackage = Join-Path $env:PACKAGE_OUTPUT "DeepSeek.Agents.AI.$env:PACKAGE_VERSION.nupkg"
          $decisionsPackage = Join-Path $env:PACKAGE_OUTPUT "DeepSeek.Decisions.$env:PACKAGE_VERSION.nupkg"

          if (-not (Test-Path $corePackage)) {
            throw "Package file not found: $corePackage"
          }

          if (-not (Test-Path $agentsPackage)) {
            throw "Package file not found: $agentsPackage"
          }

          if (-not (Test-Path $decisionsPackage)) {
            throw "Package file not found: $decisionsPackage"
          }

          Write-Host "Validated package files:"
          Write-Host " - $corePackage"
          Write-Host " - $agentsPackage"
          Write-Host " - $decisionsPackage"

      - name: NuGet login with trusted publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: yueyuan

      - name: Publish DeepSeek.Core
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$env:PACKAGE_OUTPUT/DeepSeek.Core.$env:PACKAGE_VERSION.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate `
            --no-symbols

      - name: Publish DeepSeek.Agents.AI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$env:PACKAGE_OUTPUT/DeepSeek.Agents.AI.$env:PACKAGE_VERSION.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate `
            --no-symbols

      - name: Publish DeepSeek.Decisions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$env:PACKAGE_OUTPUT/DeepSeek.Decisions.$env:PACKAGE_VERSION.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate `
            --no-symbols
